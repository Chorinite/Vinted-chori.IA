<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Vinted AI Analyzer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d1117;
font-family:Arial;
color:white;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
font-size:42px;
margin-bottom:10px;
}

.subtitle{
color:#888;
margin-bottom:30px;
}

.card{
background:#161b22;
border:1px solid #30363d;
padding:20px;
border-radius:14px;
margin-bottom:20px;
}

input,select{
width:100%;
padding:14px;
margin-top:10px;
background:#0d1117;
border:1px solid #30363d;
border-radius:10px;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#00c896;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:.9;
}

#status{
margin-top:15px;
color:#aaa;
}

.results{
margin-top:30px;
}

.item{
display:flex;
gap:15px;
background:#161b22;
border:1px solid #30363d;
padding:15px;
border-radius:14px;
margin-bottom:15px;
}

.item img{
width:120px;
height:120px;
object-fit:cover;
border-radius:12px;
background:#222;
}

.price{
font-size:22px;
color:#00c896;
font-weight:bold;
margin-top:6px;
}

.favs{
margin-top:8px;
color:#ff7b72;
}

.online{
color:#00c896;
}

.offline{
color:red;
}

</style>

</head>

<body>

<div class="container">

<h1>Vinted AI Analyzer</h1>

<div class="subtitle">
Análisis real de Vinted
</div>

<div id="server-status" class="offline">
🔴 Offline
</div>

<div class="card">

<label>Búsqueda</label>

<input
type="text"
id="query"
placeholder="Nike, Zara, Vintage..."
>

<label style="display:block;margin-top:20px">
Precio máximo
</label>

<input
type="number"
id="maxPrice"
value="100"
>

<label style="display:block;margin-top:20px">
Resultados
</label>

<select id="count">
<option value="20">20</option>
<option value="50">50</option>
<option value="100">100</option>
</select>

<button onclick="runSearch()">
Ejecutar análisis
</button>

<div id="status">
Esperando búsqueda...
</div>

</div>

<div class="results" id="results"></div>

</div>

<script>

const SCRAPER_URL =
'https://vinted-chori-ia.onrender.com';

async function checkServer(){

try{

const r =
await fetch(`${SCRAPER_URL}/health`);

const data = await r.json();

if(data.ok){

document.getElementById('server-status')
.innerHTML='🟢 Online';

document.getElementById('server-status')
.className='online';

}

}catch(err){

document.getElementById('server-status')
.innerHTML='🔴 Offline';

document.getElementById('server-status')
.className='offline';

}

}

checkServer();

async function runSearch(){

const query =
document.getElementById('query').value;

const maxPrice =
document.getElementById('maxPrice').value;

const count =
document.getElementById('count').value;

document.getElementById('status')
.innerHTML='Analizando Vinted...';

try{

const params = new URLSearchParams({
query,
maxPrice,
count
});

const r =
await fetch(
`${SCRAPER_URL}/scrape?${params}`
);

const data = await r.json();

if(!data.ok){

document.getElementById('status')
.innerHTML='Error: '+data.error;

return;

}

document.getElementById('status')
.innerHTML=
`${data.items.length} artículos encontrados`;

renderItems(data.items);

}catch(err){

document.getElementById('status')
.innerHTML=err.message;

}

}

function renderItems(items){

const results =
document.getElementById('results');

results.innerHTML='';

items.forEach(item=>{

const div =
document.createElement('div');

div.className='item';

div.innerHTML=`

<img src="${item.image}" />

<div>

<h3>${item.title}</h3>

<div class="price">
€${item.price}
</div>

<div>
${item.brand}
</div>

<div class="favs">
❤️ ${item.favorites}
</div>

<a
href="${item.url}"
target="_blank"
style="color:#00c896"
>
Ver producto
</a>

</div>

`;

results.appendChild(div);

});

}

</script>

</body>
</html>
